<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wather App</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="wrapper">
        <div class="leftPart">
            <p>WatherInfo</p>
            <div class="bottom">
                <div class="degree">
                    <h1>31.1 <sup>o</sup></h1>
                </div>
                <div class="city">
                    <h2>Seoul <br><span>14:33 - saturday , 25 7 2026</span></h2>
                    <!-- <p>14:33 - saturday , 25 7 2026</p> -->
                </div>
                <div class="img">
                    <p>⛅</p>
                </div>
            </div>
        </div>

        <div class="rightPart">
           <div class="search">
            <input type="text" placeholder="Search Location...">
             <p><i class="fa-solid fa-magnifying-glass"></i></p>

           </div>
            <hr>
            <p>Ahmedabad</p>
            <p>Surat</p>
            <p>Gandhinagar</p>
            <p>Vadobara</p>
            <hr>
            <p><b>Weather Details</b></p>
            <p class="detail">
                <span>Cloudy</span>
                <span>75%</span>
            </p>

            <p class="detail">
                <span>Humidity</span>
                <span>75%</span>
            </p>

            <p class="detail">
                <span>Wind</span>
                <span>15.8 Km/h</span>
            </p>
            <hr>
            <p class="last">Created with 🤍 by Shruti Dhanani</p>
        </div>
    </div>

</body>

</html>
